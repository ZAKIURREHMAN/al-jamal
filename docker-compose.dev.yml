# Database only, for local development with `npm run dev` on the host.
#   docker compose -f docker-compose.dev.yml up -d
# Then set in .env:
#   DATABASE_URL="postgresql://aljamal:aljamal_dev_password@localhost:5433/al_jamal?schema=public"
services:
  db:
    image: postgres:17-alpine
    container_name: al-jamal-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: aljamal
      POSTGRES_PASSWORD: aljamal_dev_password
      POSTGRES_DB: al_jamal
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aljamal -d al_jamal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data_dev:
