# Al Jamal — full stack. Secrets come from the .env file next to this file (see .env.example).
#
#   Local:       docker compose up -d --build            → http://localhost:${APP_PORT}
#   Production:  docker compose --profile prod up -d --build
#                (adds Caddy: automatic HTTPS for al-jamal.shop, www → non-www redirect)
services:
  db:
    image: postgres:17-alpine
    container_name: al-jamal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aljamal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-al_jamal}
      TZ: Asia/Karachi
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Bound to this machine only; never exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aljamal} -d ${POSTGRES_DB:-al_jamal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://al-jamal.shop}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    container_name: al-jamal-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aljamal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-al_jamal}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 48)}
      # Used once, to create the first admin account on an empty database. Never resets an existing password.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aljamal.pk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://al-jamal.shop}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TZ: Asia/Karachi
    volumes:
      - uploads:/app/uploads-data
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Nightly database dump, kept for 14 days in ./backups on the host.
  backup:
    image: postgres:17-alpine
    container_name: al-jamal-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-aljamal}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-al_jamal}
      TZ: Asia/Karachi
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

  # HTTPS reverse proxy — only started with `--profile prod` on the server that al-jamal.shop points to.
  caddy:
    image: caddy:2-alpine
    container_name: al-jamal-caddy
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
